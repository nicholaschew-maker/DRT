<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>46th Annual Gala Dinner - Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #004a99; /* 建议使用公司标志性蓝色 */
            --accent-color: #d4af37;  /* 金色，增加晚宴氛围 */
            --text-color: #333;
            --bg-color: #f9f9f9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px; /* 针对手机屏幕宽度优化 */
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Logo 样式 */
        .logo {
            width: 180px;
            margin-bottom: 30px;
        }

        /* 标题区域 */
        .header-section {
            margin-bottom: 40px;
        }

        .sub-title {
            font-size: 14px;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .main-title {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.2;
            margin: 0 0 20px 0;
            color: var(--primary-color);
        }

        /* “主动” 标签样式 */
        .theme-tag {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 8px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }

        /* 按钮列表区域 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .nav-button {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            color: var(--primary-color);
            text-decoration: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid #eee;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .nav-button:active {
            transform: scale(0.98);
            background-color: #f0f0f0;
        }

        .nav-button i {
            margin-right: 10px;
            font-size: 20px;
        }

        /* 页脚 */
        footer {
            margin-top: auto;
            padding: 30px 0;
            font-size: 12px;
            color: #999;
        }

        /* 简单的动画效果 */
        .fade-in {
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container fade-in">
        <img src="https://via.placeholder.com/180x60?text=YM+GROUP+LOGO" alt="Company Logo" class="logo">

        <div class="header-section">
            <div class="sub-title">YOU ARE INVITED TO</div>
            <h1 class="main-title">46th Annual Gala Dinner</h1>
            <div class="theme-tag">主动 INITIATIVE</div>
        </div>

        <div class="button-group">
            <a href="https://maps.google.com" class="nav-button">
                📍 活动地点 (Event Location)
            </a>

            <a href="#" class="nav-button">
                🕒 活动流程表 (Event Schedule)
            </a>

            <a href="#" class="nav-button">
                ℹ️ 更多讯息 (More Information)
            </a>
        </div>

        <footer>
            © 2026 YonMing Group. All Rights Reserved.
        </footer>
    </div>

</body>
</html>
